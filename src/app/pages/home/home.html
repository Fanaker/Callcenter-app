<div *ngIf="!isRegisterMode && !isVerificationMode" class="login-container">
  <h2>Iniciar Sesión - Quantia</h2>

  <div class="login-form">
    <label>Usuario</label>
    <input type="text" placeholder="Ingresa tu usuario" [(ngModel)]="username">

    <label>Contraseña</label>
    <input type="password" placeholder="Ingresa tu contraseña" [(ngModel)]="password">

    <button (click)="login()" [disabled]="!username.trim() || !password.trim()">Iniciar Sesión</button>

    <div class="switch-mode">
      <p>¿No tienes cuenta? <a (click)="switchToRegister()" class="link">Crear cuenta</a></p>
    </div>
  </div>
</div>

<div *ngIf="isRegisterMode && !isVerificationMode" class="register-container">
  <h2>Crear Cuenta - Quantia</h2>

  <div class="register-form">
    <label>DNI (8 dígitos)</label>
    <input type="text" placeholder="Ingresa tu DNI" [(ngModel)]="dni" maxlength="8" pattern="[0-9]{8}">

    <label>Nombre</label>
    <input type="text" placeholder="Ingresa tu nombre" [(ngModel)]="nombre">

    <label>Apellido</label>
    <input type="text" placeholder="Ingresa tu apellido" [(ngModel)]="apellido">

    <label>Correo</label>
    <input type="email" placeholder="Ingresa tu correo" [(ngModel)]="correo">

    <label>Contraseña</label>
    <input type="password" placeholder="Ingresa tu contraseña" [(ngModel)]="newPassword">

    <label>Verificar Contraseña</label>
    <input type="password" placeholder="Confirma tu contraseña" [(ngModel)]="confirmPassword">

    <button (click)="register()" [disabled]="!dni.trim() || dni.length !== 8 || !nombre.trim() || !apellido.trim() || !correo.trim() || !newPassword.trim() || newPassword !== confirmPassword">Crear Cuenta</button>

    <div class="switch-mode">
      <p>¿Ya tienes cuenta? <a (click)="switchToLogin()" class="link">Iniciar sesión</a></p>
    </div>
  </div>
</div>

<div *ngIf="isVerificationMode" class="verification-container">
  <h2>Verificar Correo - Quantia</h2>

  <div class="verification-form">
    <p>Se ha enviado un código de verificación a {{ correo }}.</p>

    <label>Código de Verificación</label>
    <input type="text" placeholder="Ingresa el código" [(ngModel)]="verificationCode" maxlength="6">

    <button (click)="verifyCode()" [disabled]="!verificationCode.trim() || verificationCode.length !== 6">Verificar</button>

    <div class="switch-mode">
      <p><a (click)="switchToRegister()" class="link">Volver a crear cuenta</a></p>
    </div>
  </div>
</div>
